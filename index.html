<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<style>
    body {
        margin: 0;
        padding: 0;
        display: flex;
        height: 100vh;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #153677, #4e085f);
        color: white;
        box-sizing: border-box;
        justify-content: center;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }

    .main-container {
        max-width: 600px;
        width: 90%;
    }

    h1 {
        font-size: 3rem;
        letter-spacing: 3px;
        text-align: center;
    }

    .time {
        display: flex;
        justify-content: space-between;
        margin-top: -30px;
    }

    .time .set {
        height: 30px;
        padding: 0.7em 1em;
        background-color: rgba(182, 59, 14, 0.727);
        font-size: 3rem;
        letter-spacing: 1.5px;
        text-shadow: 1px 0 3px rgba(0, 0, 0, 0.382);
    }

    .time-down {
        display: flex;
        justify-content: space-between;
    }

    .time-down .set-descp {
        background-color: rgba(193, 131, 251, 0.689);
        margin-top: -3em;
        text-align: center;
    }

    .time-down .hours-words {
        padding: 1.3em 2.935em;
    }

    .time-down .minutes-words {
        padding: 1.3em 2.545em;
    }

    .time-down .seconds-words {
        padding: 1.3em 2.365em;
    }

    .ampm {
        background-color: rgba(161, 251, 188, 0.689);
        padding: 1.3em 2.365em;
        text-align: center;
        font-size: 1rem;
        position: relative;
        left: 650px;
        bottom: 55px;
    }
</style>
<body>
    <div class="main-container">
        <h1>DIGITAL CLOCK</h1>
        <div class="time">
            <p id="hour" class="hours set">00</p>
            <p id="minute" class="minutes set">00</p>
            <p id="second" class="seconds set">00</p>
        </div>
        <div class="time-down">
            <p class="hours-words set-descp">HOURS</p>
            <p class="minutes-words set-descp">MINUTES</p>
            <p class="seconds-words set-descp">SECONDS</p>
        </div>
        <span class="ampm">AM</span>
    </div>
    <script>
        let hoursId = document.getElementById('hours');
            let minutesId = document.getElementById('minutes');
            let secondsId = document.getElementById('seconds');
            let ampmId = document.querySelector("ampm");
            function updateClock() {
                let h = new Date().getHours();
                let m = new Date().getMinutes();
                let s = new Date().getSeconds();
                let ampm = "AM";
                if (h > 12) {
                    h = h - 12;
                    ampm = "AM"
                }
                else {
                    ampm = "PM"
                }
                h = h < 10 ? "0" + h : h;
                m = m < 10 ? "0" + m : m;
                s = s < 10 ? "0" + s : s;
                hoursId.innerText = h;
                minutesId.innerText = m;
                secondsId.innerText = s;
                ampmId.innerText = ampm;
            }
            UpdateClock();
        </script>
    </body>
</html>
